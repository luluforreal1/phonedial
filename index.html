<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Faux Téléphone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    .contacts {
      padding: 1rem;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding: 1rem 0;
    }

    .contact-info {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #666;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 1rem;
    }

    .phone-label {
      font-size: 0.9rem;
      color: #bbb;
    }   

    .call-icon {
      font-size: 1.5rem;
      color: #00cc66;
      transform: rotate(-30deg);
    }

    .dialer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      padding: 1rem;
    }

    .dial-button {
      background-color: #222;
      color: white;
      border: none;
      font-size: 1.5rem;
      padding: 1.5rem;
      border-radius: 2rem;
    }

    .dial-button:active {
      background-color: #444;
    }

    .flexquick {
        width: 95%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .screen {
      text-align: center;
      font-size: 1.8rem;
      width: 80%;
      letter-spacing: 2px;
      min-height: 3rem;
      color: #fff;
    }

    .delete-btn {
        align-self: flex-end;
      border: none;
      width: 10%;
      font-size: 2rem;
      color: #ffffff;
    }

    .blank {
      border: none;
      width: 10%;
      font-size: 2rem;
      color: white;
    }

    .call-btn {
      grid-column: span 3;
      background-color: #00cc66;
      color: black;
      font-weight: bold;
      font-size: 1.2rem;
      border-radius: 2rem;
      padding: 1rem;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="contacts">
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">M</div>
          <div>
            <div>Maman</div>
            <div class="phone-label">Portable 0781469118</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">M</div>
          <div>
            <div>Mathilde</div>
            <div class="phone-label">Portable +33788156777</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">L</div>
          <div>
            <div>Lucas</div>
            <div class="phone-label">Portable +33614251261</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">M</div>
          <div>
            <div>Mamie</div>
            <div class="phone-label">Portable +33684147749</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
      <!-- Faux contacts supplémentaires -->
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">C</div>
          <div>
            <div>Camille</div>
            <div class="phone-label">Portable +33600000001</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
      <div class="contact">
        <div class="contact-info">
          <div class="avatar">J</div>
          <div>
            <div>Julien</div>
            <div class="phone-label">Portable +33600000002</div>
          </div>
        </div>
        <div class="call-icon">📞</div>
      </div>
    </div>
<div class="flexquick">
    <div class="blank"></div>
    <div class="screen" id="screen"></div>
    <div><button class="delete-btn" onclick="deleteLast()"><i class="bi bi-backspace-fill"></i></button></div>
</div>

    <div class="dialer">
      <button class="dial-button" onclick="pressKey('1')">1</button>
      <button class="dial-button" onclick="pressKey('2')">2<br><span style='font-size:0.6rem;'>ABC</span></button>
      <button class="dial-button" onclick="pressKey('3')">3<br><span style='font-size:0.6rem;'>DEF</span></button>
      <button class="dial-button" onclick="pressKey('4')">4<br><span style='font-size:0.6rem;'>GHI</span></button>
      <button class="dial-button" onclick="pressKey('5')">5<br><span style='font-size:0.6rem;'>JKL</span></button>
      <button class="dial-button" onclick="pressKey('6')">6<br><span style='font-size:0.6rem;'>MNO</span></button>
      <button class="dial-button" onclick="pressKey('7')">7<br><span style='font-size:0.6rem;'>PQRS</span></button>
      <button class="dial-button" onclick="pressKey('8')">8<br><span style='font-size:0.6rem;'>TUV</span></button>
      <button class="dial-button" onclick="pressKey('9')">9<br><span style='font-size:0.6rem;'>WXYZ</span></button>
      <button class="dial-button" onclick="pressKey('*')">*</button>
      <button class="dial-button" onclick="pressKey('0')">0<br><span style='font-size:0.6rem;'>+</span></button>
      <button class="dial-button" onclick="pressKey('#')">#</button>
      <button class="call-btn" onclick="callNumber()">📞 Appeler</button>
    </div>
  </div>

  <audio id="secretAudio" src="./cell-phone-ring-in-ear_bip-79193.mp3"></audio>
  <audio id="toneAudio" src="dialtone.mp3"></audio>

  <script>
    const screen = document.getElementById('screen');
    const audio = document.getElementById('secretAudio');
    const tone = document.getElementById('toneAudio');
    let code = '';

    const secretCode = '4269';

    function pressKey(key) {
      if (code.length < 10) {
        code += key;
        screen.textContent = code;
      }
    }

    function deleteLast() {
      code = code.slice(0, -1);
      screen.textContent = code;
    }

    function callNumber() {
      tone.currentTime = 0;
      tone.play();
      setTimeout(() => {
        if (code === secretCode) {
          audio.play();
          window.open('appel.html', '_blank');
           setTimeout(() => {
    screen.textContent = '';
    code = '';
  }, 2000);
        } else {
          screen.textContent = '⛔ Numéro invalide';
          setTimeout(() => {
    screen.textContent = '';
    code = '';
  }, 2000);
        }
      }, 100);
    }
  </script>

  <style>
    body {
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .profile {
      text-align: center;
      margin-bottom: 1rem;
    }

    .avatar {
      background: #333;
      border-radius: 50%;
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
    }

    .name {
      font-size: 1.5rem;
      margin-top: 0.5rem;
    }

    .status {
      margin-top: 0.25rem;
      color: #aaa;
    }

    .buttons {
      margin: 2rem 0 1rem;
      display: flex;
      gap: 20px;
    }

    .buttons button {
      background: #222;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      border: none;
      color: white;
      font-size: 1.2rem;
    }

    .buttons button:active {
      background: white;
      color: black;
    }

    .timer {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .end-call {
      background: red;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      border: none;
      font-size: 2rem;
      color: white;
    }
  </style>
</head>
<body>
  <div class="profile">
    <div class="avatar">A</div>
    <div class="name">Andrea</div>
    <div class="status" id="status">Appel en cours…</div>
  </div>

  <div class="buttons">
    <button>🎤</button>
    <button>🔊</button>
    <button>⏸️</button>
    <button>🔢</button>
  </div>

  <div class="timer" id="timer" style="display: none;">00:00</div>
  <button class="end-call" onclick="endCall()">📴</button>

  <audio id="tone" src="./cell-phone-ring-in-ear_bip-79193.mp3"></audio>
  <audio id="call" src="ending.mp3"></audio>
  <audio id="hangup" src="hangup.mp3"></audio>

  <script>
    const call = document.getElementById('call');
    const hangup = document.getElementById('hangup');
    const timer = document.getElementById('timer');
    const status = document.getElementById('status');

    let seconds = 0;
    let interval;

      window.onload = function () {
    const audio = document.getElementById('audio');
    audio.play();
  };

    function formatTime(s) {
      const mins = Math.floor(s / 60).toString().padStart(1, '0');
      const secs = (s % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startTimer() {
      timer.style.display = 'block';
      interval = setInterval(() => {
        seconds++;
        timer.textContent = formatTime(seconds);
      }, 1000);
    }

    function endCall() {
      hangup.play();
      clearInterval(interval);
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }

    tone.play();
    tone.onended = () => {
      status.textContent = 'Appel avec Andrea';
      call.play();
      startTimer();
      call.onended = () => {
        endCall();
      };
    };
  </script>
</body>
</html>
