<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Faux Téléphone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      font-family: sans-serif;
      color: white;
    }

    .screen-container {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .active {
      display: flex !important;
    }

    /* --- ÉCRAN 1 : Faux téléphone --- */
    #screen-phone {
      background-color: #0a0a0a;
      overflow-y: auto;
    }

    .contacts {
      padding: 1rem;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding: 1rem 0;
    }

    .contact-info {
      display: flex;
      align-items: center;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #666;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 1rem;
    }

    .phone-label {
      font-size: 0.9rem;
      color: #bbb;
    }

    .call-icon {
      font-size: 1.5rem;
      color: #00cc66;
      transform: rotate(-30deg);
    }

    .flexquick {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
    }

    .screen {
      font-size: 1.8rem;
      width: 80%;
      letter-spacing: 2px;
      min-height: 3rem;
      text-align: center;
    }

    .delete-btn, .blank {
      border: none;
      background: none;
      color: white;
      font-size: 2rem;
    }

    .dialer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      padding: 1rem;
    }

    .dial-button, .call-btn {
      background-color: #222;
      color: white;
      border: none;
      font-size: 1.5rem;
      padding: 1.2rem;
      border-radius: 2rem;
    }

    .dial-button:active {
  transform: scale(0.95);
  box-shadow: 0 0 8px #00cc66;
}

    .call-btn {
      grid-column: span 3;
      background-color: #00cc66;
      color: black;
      font-weight: bold;
    }

    /* --- ÉCRAN 2 : Appel en cours --- */
    #screen-call {
        padding-bottom: 40%;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #screen-call .avatar {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      margin: auto;
      margin-bottom: 0.5rem;
    }

    .buttons {
      margin: 1rem 0;
      display: flex;
      gap: 20px;
    }

    .buttons button {
      background: #222;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      border: none;
      color: white;
      font-size: 1.2rem;
    }

    .end-call {
      background: red;
      width: 80px;
      height: 80px;
      font-size: 2rem;
      border-radius: 50%;
      border: none;
      margin-top: 1rem;
    }

    .timer {
      font-size: 1.2rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- ÉCRAN : Faux Téléphone -->
  <div id="screen-phone" class="screen-container active">
    <div class="contacts">
      <div class="contact"><div class="contact-info"><div class="avatar">M</div><div><div>Maman</div><div class="phone-label">07 45 67 85 21</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
      <div class="contact"><div class="contact-info"><div class="avatar">M</div><div><div>Mathilde</div><div class="phone-label">07 88 00 57 89</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
      <div class="contact"><div class="contact-info"><div class="avatar">L</div><div><div>Lucas</div><div class="phone-label">0654258996</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
      <div class="contact"><div class="contact-info"><div class="avatar">M</div><div><div>Mamie</div><div class="phone-label">06 54 12 36 85</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
      <div class="contact"><div class="contact-info"><div class="avatar">J</div><div><div>Juliette</div><div class="phone-label">05 47 86 95 87</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
      <div class="contact"><div class="contact-info"><div class="avatar">P</div><div><div>Papa</div><div class="phone-label">07 85 41 26 89</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
       <div class="contact"><div class="contact-info"><div class="avatar">C</div><div><div>Claire</div><div class="phone-label">06 51 24 57 89</div></div></div><div class="call-icon"><i class="bi bi-telephone"></i></div></div>
    </div>
    <div class="flexquick">
      <div class="blank"></div>
      <div class="screen" id="screen"></div>
      <button class="delete-btn" onclick="deleteLast()"><i class="bi bi-backspace-fill"></i></button>
    </div>
    <div class="dialer">
      <button class="dial-button" onclick="pressKey('1')">1</button>
      <button class="dial-button" onclick="pressKey('2')">2<br><span style='font-size:0.6rem;'>ABC</span></button>
      <button class="dial-button" onclick="pressKey('3')">3<br><span style='font-size:0.6rem;'>DEF</span></button>
      <button class="dial-button" onclick="pressKey('4')">4<br><span style='font-size:0.6rem;'>GHI</span></button>
      <button class="dial-button" onclick="pressKey('5')">5<br><span style='font-size:0.6rem;'>JKL</span></button>
      <button class="dial-button" onclick="pressKey('6')">6<br><span style='font-size:0.6rem;'>MNO</span></button>
      <button class="dial-button" onclick="pressKey('7')">7<br><span style='font-size:0.6rem;'>PQRS</span></button>
      <button class="dial-button" onclick="pressKey('8')">8<br><span style='font-size:0.6rem;'>TUV</span></button>
      <button class="dial-button" onclick="pressKey('9')">9<br><span style='font-size:0.6rem;'>WXYZ</span></button>
      <button class="dial-button" onclick="pressKey('*')">*</button>
      <button class="dial-button" onclick="pressKey('0')">0<br><span style='font-size:0.6rem;'>+</span></button>
      <button class="dial-button" onclick="pressKey('#')">#</button>
      <button class="call-btn" onclick="callNumber()"><i class="bi bi-telephone"></i> Appeler</button>
    </div>
  </div>

  <!-- ÉCRAN : Appel en cours -->
  <div id="screen-call" class="screen-container">
    <div class="avatar">A</div>
    <div class="name">Andrea</div>
    <div class="status" id="status">Appel en cours…</div>

    <div class="buttons">
      <button><i class="bi bi-mic-mute"></i></button>
      <button><i class="bi bi-bluetooth"></i></button>
      <button><i class="bi bi-pause"></i></button>
      <button><i class="bi bi-grip-vertical"></i></button>
    </div>
    <div class="timer" id="timer" style="display: none;">00:00</div>
    <button class="end-call" onclick="endCall()"><i class="bi bi-telephone-inbound"></i></button>
  </div>

  <!-- Sons -->
  <audio id="secretAudio" src="cell-phone-ring-in-ear_bip-79193.mp3"></audio>

  <script>
    touchSounds.forEach(audio => {
  audio.preload = 'auto';
  audio.load(); // Forcer le préchargement
});
    const screen = document.getElementById('screen');
    const tone = document.getElementById('toneAudio');
    const ring = document.getElementById('secretAudio');
    const call = document.getElementById('callAudio');
    const hangup = document.getElementById('hangupAudio');
    const timer = document.getElementById('timer');
    const status = document.getElementById('status');
    const touchSounds = [
  new Audio('touch1.mp3'),
  new Audio('touch2.mp3'),
  new Audio('touch3.mp3'),
  new Audio('touch4.mp3'),
  new Audio('touch5.mp3'),
  new Audio('touch6.mp3'),
  new Audio('touch7.mp3'),
  new Audio('touch8.mp3')
];

    


    const screenPhone = document.getElementById('screen-phone');
    const screenCall = document.getElementById('screen-call');
    
    let code = '';
    const secretCode = '0755894174';
    let seconds = 0;
    let interval;

   

let lastSoundIndex = -1;

function playRandomTouchSound() {
  let index;
  do {
    index = Math.floor(Math.random() * touchSounds.length);
  } while (index === lastSoundIndex); 
  lastSoundIndex = index;

  const sound = touchSounds[index];
  sound.currentTime = 0;
  sound.play();
}


    function formatPhoneNumber(raw) {
  return raw.match(/.{1,2}/g)?.join(' ') || '';
}

    function pressKey(key) {
      if (code.length < 10) {
        code += key;
        playRandomTouchSound();
        screen.textContent = formatPhoneNumber(code);
      }
    }

    function deleteLast() {
      code = code.slice(0, -1);
      screen.textContent = formatPhoneNumber(code);
    }

    function formatTime(s) {
      const mins = Math.floor(s / 60).toString().padStart(1, '0');
      const secs = (s % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startTimer() {
      timer.style.display = 'block';
      interval = setInterval(() => {
        seconds++;
        timer.textContent = formatTime(seconds);
      }, 1000);
    }

    function callNumber() {
      setTimeout(() => {
        if (code === secretCode) {
          screenPhone.classList.remove('active');
          screenCall.classList.add('active');
          ring.play();
          ring.onended = () => {
            status.textContent = 'Appel avec Andrea';
            call.play();
            startTimer();
            call.onended = () => {
              endCall();
            };
          };
        } else {
          screen.textContent = '⛔ Numéro invalide';
          setTimeout(() => {
            screen.textContent = '';
                        code = '';
          }, 2000);
        }
      }, 1000); // simulation de délai tonalité
    }


    function endCall() {
      ring.pause();
      ring.currentTime = 0;
      clearInterval(interval);
      seconds = 0;
      timer.textContent = '00:00';
      timer.style.display = 'none';
      status.textContent = 'Appel en cours…';
      screenCall.classList.remove('active');
      screenPhone.classList.add('active');
      screen.textContent = '';
      code = '';
    }
  </script>
</body>
</html>
